---
- name: Configure users
  import_tasks: users.yml
  when: common_users_manage | bool
  tags: users

- name: Configure timezone
  import_tasks: timezone.yml
  when: common_timezone_manage | bool
  tags: timezone

- name: Configure DNS search domains
  import_tasks: dns.yml
  when: common_dns_manage | bool
  tags: dns

- name: Configure NFS mounts
  import_tasks: nfs.yml
  when: common_nfs_manage | bool
  tags: nfs

- name: Configure local disks
  import_tasks: disks.yml
  when: common_disks_manage | bool
  tags: disks

- name: Include geerlingguy.firewall role if desired
  import_role:
    name: geerlingguy.firewall
  when: common_firewall_manage | bool
  tags: firewall

- name: Install common packages
  ansible.builtin.import_tasks: packages.yml
  when: common_packages_manage | bool
  tags: packages

- name: Update packages and reboot if needed
  import_tasks: update.yml
  when: common_update_manage | bool
  tags:
    - update
    - never
